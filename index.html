<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Café — Café · Bar · Crêperie · Compiègne</title>
  <meta name="description" content="Pastel Café, un écrin floral au cœur de Compiègne. Café, bar et crêperie au 3 bis rue Napoléon, 60200 Compiègne.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ─── RESET ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    /* ─── TOKENS ─── */
    :root {
      --bg:        #FAF9F6;
      --white:     #FFFFFF;
      --beige:     #F1EDE6;
      --sand:      #E7E0D5;
      --terra:     #C8825A;
      --terra-soft:#E8C4A8;
      --ink:       #161412;
      --muted:     #6F6A63;
      --line:      rgba(22,20,18,.08);
      --r-lg: 24px;
      --r-md: 18px;
      --r-pill: 100px;
      --ff: 'Jost', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ff);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    a   { color: inherit; text-decoration: none; }
    button { font-family: var(--ff); }

    .container { max-width: 1140px; margin: 0 auto; padding: 0 1.4rem; }

    /* ─── BOUTONS ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .72rem 1.7rem;
      border-radius: var(--r-pill);
      font-size: .85rem;
      font-weight: 400;
      letter-spacing: .02em;
      transition: opacity .25s, background .25s, color .25s;
      border: none;
      cursor: pointer;
    }
    .btn--dark  { background: var(--ink); color: #fff; }
    .btn--dark:hover  { opacity: .82; }
    .btn--light { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn--light:hover { background: var(--beige); }

    /* ─── TYPE ─── */
    .h-xl {
      font-size: clamp(2.3rem, 6vw, 3.8rem);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -.02em;
    }
    .h-lg {
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -.015em;
    }
    .sub { color: var(--muted); font-size: .98rem; }

    /* ─── REVEAL ─── */
    .reveal { opacity: 1; transform: none; transition: opacity .8s ease, transform .8s ease; }
    .reveal.will-animate { opacity: 0; transform: translateY(20px); }
    .reveal.in { opacity: 1; transform: none; }
    .reveal.d1 { transition-delay: .1s; }
    .reveal.d2 { transition-delay: .2s; }
    .reveal.d3 { transition-delay: .3s; }

    /* ════════════════════════
       NAV
    ════════════════════════ */
    #nav {
      position: fixed;
      inset: 0 0 auto;
      z-index: 900;
      background: rgba(250,249,246,.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid transparent;
      transition: border-color .3s;
    }
    #nav.scrolled { border-color: var(--line); }
    .nav-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: .7rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .nav-brand { display: flex; align-items: center; gap: .65rem; }
    .nav-logo-img {
      width: 42px; height: 42px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    .nav-brand span { font-weight: 500; font-size: 1.05rem; letter-spacing: -.01em; }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.9rem;
      align-items: center;
    }
    .nav-links a {
      font-size: .82rem;
      font-weight: 400;
      color: var(--muted);
      transition: color .25s;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-cta { white-space: nowrap; }

    .burger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none; border: none;
      cursor: pointer; padding: 8px;
    }
    .burger span {
      display: block;
      width: 22px; height: 1.6px;
      background: var(--ink);
      transition: .3s;
      border-radius: 2px;
    }
    .burger.open span:nth-child(1) { transform: rotate(45deg) translate(4px,4px); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: rotate(-45deg) translate(4px,-4px); }

    @media (max-width: 880px) {
      .nav-links, .nav-cta { display: none; }
      .burger { display: flex; }
    }

    .mobile-nav {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 850;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    .mobile-nav.open { opacity: 1; pointer-events: all; }
    .mobile-nav a {
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--ink);
    }
    .mobile-nav a:active { color: var(--terra); }

    /* ════════════════════════
       HERO
    ════════════════════════ */
    #hero { padding: 7.5rem 0 3rem; }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 3rem;
      align-items: center;
      margin-bottom: 2.2rem;
    }
    .hero-copy .h-xl { max-width: 560px; }
    .hero-copy .sub { margin-top: 1.1rem; max-width: 420px; }
    .hero-actions { display: flex; gap: .8rem; margin-top: 1.8rem; flex-wrap: wrap; }

    .hero-perks {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .85rem;
      justify-self: end;
    }
    .hero-perks li {
      display: flex;
      align-items: center;
      gap: .65rem;
      font-size: .88rem;
      color: var(--muted);
    }
    .perk-ico {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--beige);
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem;
      flex-shrink: 0;
    }

    @media (max-width: 880px) {
      #hero { padding: 6.2rem 0 2rem; }
      .hero-grid { grid-template-columns: 1fr; gap: 2.2rem; }
      .hero-perks { justify-self: start; }
    }

    /* ── Bento ── */
    .bento {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 1.1rem;
    }
    .bento-card {
      border-radius: var(--r-lg);
      overflow: hidden;
      position: relative;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.8rem;
    }
    .bento-card--photo {
      background: var(--sand);
    }
    .bento-card--photo img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .bento-card--photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.55) 0%, transparent 55%);
    }
    .bento-card--photo > * { position: relative; z-index: 2; }
    .bento-card--photo h3 { color: #fff; font-size: 1.5rem; font-weight: 400; }
    .bento-card--photo p  { color: rgba(255,255,255,.85); font-size: .88rem; margin: .3rem 0 1.1rem; }

    .bento-card--terra {
      background: linear-gradient(150deg, var(--terra-soft) 0%, var(--terra) 100%);
      color: #fff;
      justify-content: space-between;
    }
    .bento-logo {
      width: 110px; height: 110px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 12px 36px rgba(0,0,0,.18);
    }
    .bento-card--terra h3 { font-size: 1.5rem; font-weight: 400; margin-top: 1.2rem; }
    .bento-card--terra .price { font-size: 2.2rem; font-weight: 500; margin: .2rem 0 .4rem; }
    .bento-card--terra p { font-size: .87rem; opacity: .92; margin-bottom: 1.1rem; }
    .bento-card--terra .btn--light { border: none; }

    @media (max-width: 880px) {
      .bento { grid-template-columns: 1fr; }
      .bento-card { min-height: 300px; }
    }

    /* ── Mini cards ── */
    .minis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.1rem;
      margin-top: 1.1rem;
    }
    .mini {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 1.1rem 1.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: transform .3s, box-shadow .3s;
    }
    .mini:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(22,20,18,.07); }
    .mini-txt strong { display: block; font-weight: 500; font-size: .92rem; }
    .mini-txt span   { font-size: .78rem; color: var(--muted); }
    .mini-arrow {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--beige);
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem;
      flex-shrink: 0;
    }
    @media (max-width: 880px) { .minis { grid-template-columns: 1fr; } }

    /* ════════════════════════
       SECTIONS
    ════════════════════════ */
    .section { padding: 5.5rem 0; }
    .section-head { max-width: 560px; margin-bottom: 3rem; }
    .eyebrow {
      display: inline-block;
      padding: .3rem 1rem;
      border-radius: var(--r-pill);
      background: var(--beige);
      font-size: .72rem;
      font-weight: 400;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.1rem;
    }
    .section-head .sub { margin-top: .8rem; }

    /* ── Histoire ── */
    .histoire-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5rem;
      align-items: center;
    }
    .histoire-text p { color: var(--muted); font-size: .95rem; margin-top: 1.2rem; }
    .tags { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: 1.8rem; }
    .tag {
      padding: .26rem 1rem;
      border-radius: var(--r-pill);
      background: var(--beige);
      font-size: .74rem;
      color: var(--muted);
    }
    .histoire-photo img {
      width: 100%;
      height: 470px;
      object-fit: cover;
      border-radius: var(--r-lg);
    }
    @media (max-width: 880px) {
      .histoire-grid { grid-template-columns: 1fr; gap: 2.2rem; }
      .histoire-photo img { height: 320px; }
    }

    /* ── Carte ── */
    #carte { background: var(--white); border-radius: var(--r-lg); margin: 0 1rem; }
    @media (min-width: 1200px) { #carte { margin: 0 auto; max-width: 1240px; } }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: .5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin-bottom: 2.4rem;
      padding-bottom: .3rem;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--beige);
      border: none;
      border-radius: var(--r-pill);
      padding: .55rem 1.4rem;
      font-size: .82rem;
      font-weight: 400;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background .25s, color .25s;
    }
    .tab-btn.active { background: var(--ink); color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .menu-card {
      background: var(--bg);
      border-radius: var(--r-md);
      padding: 1.9rem 2rem;
      max-width: 620px;
    }
    .menu-card h3 { font-weight: 500; font-size: 1.15rem; margin-bottom: 1.1rem; }
    .menu-list { list-style: none; }
    .menu-list li {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .62rem 0;
      border-bottom: 1px solid var(--line);
      font-size: .9rem;
    }
    .menu-list li:last-child { border: none; }
    .menu-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--terra); flex-shrink: 0; }
    .badge-gf {
      display: inline-block;
      margin-top: 1.1rem;
      padding: .3rem 1rem;
      border-radius: var(--r-pill);
      background: var(--beige);
      font-size: .74rem;
      color: var(--muted);
    }

    /* ── Galerie ── */
    .masonry { columns: 3; column-gap: 1rem; }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
      border-radius: var(--r-md);
    }
    .masonry-item img { width: 100%; transition: transform .5s ease; }
    .masonry-item .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.45), transparent 55%);
      opacity: 0;
      transition: opacity .35s;
      display: flex;
      align-items: flex-end;
      padding: 1rem;
    }
    .masonry-item .overlay span { color: #fff; font-size: .85rem; }
    .masonry-item:hover img { transform: scale(1.04); }
    .masonry-item:hover .overlay { opacity: 1; }
    /* ── Galerie visual panels ── */
    .gal-visual {
      width: 100%; border-radius: var(--r-md);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .8rem;
    }
    .gv-icon  { font-size: 2.8rem; line-height: 1; }
    .gv-label { font-size: .7rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
    .gv-coffee    { background: linear-gradient(145deg,#FFF3E8 0%,#D4946A 100%); color: #6A2E08; }
    .gv-floral    { background: linear-gradient(145deg,#F0F8EC 0%,#78B85C 100%); color: #1E5008; }
    .gv-shake     { background: linear-gradient(145deg,#F0F4FF 0%,#8098E0 100%); color: #1A2A70; }
    .gv-interieur { background: linear-gradient(145deg,#FFF0E8 0%,#C87848 100%); color: #602010; }
    .gv-latte     { background: linear-gradient(145deg,#FFFCE8 0%,#DCC040 100%); color: #503808; }
    .gv-table     { background: linear-gradient(145deg,#F8F0E8 0%,#B89860 100%); color: #482810; }
    .gv-plantes   { background: linear-gradient(145deg,#EDFAE8 0%,#58A840 100%); color: #0E3808; }
    .gv-cozy      { background: linear-gradient(145deg,#FEF6F0 0%,#E0846C 100%); color: #601810; }
    @media (max-width: 880px) { .masonry { columns: 2; } }
    @media (max-width: 500px) { .masonry { columns: 1; } }

    /* ── Contact ── */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 2.5rem;
      align-items: start;
    }
    .contact-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 2rem;
    }
    .info-row {
      display: flex;
      gap: 1rem;
      padding: .85rem 0;
      border-bottom: 1px solid var(--line);
      align-items: flex-start;
    }
    .info-row:last-of-type { border: none; }
    .info-ico {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--beige);
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem;
      flex-shrink: 0;
    }
    .info-body { font-size: .89rem; }
    .info-lbl {
      display: block;
      font-size: .68rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .info-body a { color: var(--terra); }

    .horaires { width: 100%; border-collapse: collapse; margin-top: .4rem; }
    .horaires td { padding: .5rem 0; font-size: .87rem; border-bottom: 1px solid var(--line); }
    .horaires td:first-child { color: var(--muted); padding-right: 1rem; }
    .horaires tr:last-child td { border: none; }

    .rating {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin-top: 1.4rem;
      padding: .9rem 1.2rem;
      border-radius: var(--r-md);
      background: var(--beige);
    }
    .stars { color: var(--terra); letter-spacing: .08rem; }
    .rating p { font-size: .82rem; color: var(--muted); }

    /* ── Newsletter card ── */
    .newsletter-card {
      background: var(--ink);
      border-radius: var(--r-lg);
      padding: 2.8rem 2.4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.4rem;
      min-height: 340px;
    }
    .newsletter-card .nl-eyebrow {
      font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
      color: var(--terra-soft); font-weight: 500;
    }
    .newsletter-card h3 { color: #fff; font-size: 1.5rem; font-weight: 400; line-height: 1.3; }
    .newsletter-card p  { color: rgba(255,255,255,.55); font-size: .88rem; line-height: 1.65; }
    .nl-form { display: flex; flex-direction: column; gap: .75rem; margin-top: .4rem; }
    .nl-form input[type="email"] {
      width: 100%; padding: .85rem 1.1rem;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--r-pill);
      color: #fff; font-family: var(--ff); font-size: .9rem;
      outline: none; transition: border-color .2s;
    }
    .nl-form input[type="email"]::placeholder { color: rgba(255,255,255,.35); }
    .nl-form input[type="email"]:focus { border-color: var(--terra-soft); }
    .nl-form input[type="text"] {
      width: 100%; padding: .85rem 1.1rem;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--r-pill);
      color: #fff; font-family: var(--ff); font-size: .9rem;
      outline: none; transition: border-color .2s;
    }
    .nl-form input[type="text"]::placeholder { color: rgba(255,255,255,.35); }
    .nl-form input[type="text"]:focus { border-color: var(--terra-soft); }
    .nl-submit {
      padding: .85rem 1.6rem;
      background: var(--terra); color: #fff;
      border: none; border-radius: var(--r-pill);
      font-family: var(--ff); font-size: .88rem; font-weight: 500;
      letter-spacing: .06em; cursor: pointer;
      transition: background .25s, transform .15s;
    }
    .nl-submit:hover { background: #b5724d; transform: translateY(-1px); }
    .nl-success {
      display: none; padding: 1rem 1.2rem;
      background: rgba(200,130,90,.15);
      border: 1px solid var(--terra-soft);
      border-radius: var(--r-md);
      color: var(--terra-soft); font-size: .88rem; text-align: center;
    }
    .nl-error {
      display: none; padding: .8rem 1rem;
      background: rgba(220,80,80,.12);
      border: 1px solid rgba(220,80,80,.4);
      border-radius: var(--r-md);
      color: #f08080; font-size: .84rem;
    }
    @media (max-width: 880px) {
      .contact-grid { grid-template-columns: 1fr; }
      .newsletter-card { padding: 2rem 1.6rem; min-height: auto; }
    }

    /* ════════════════════════
       FOOTER
    ════════════════════════ */
    footer {
      background: var(--ink);
      color: rgba(255,255,255,.65);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      margin-top: 3rem;
      padding: 3.5rem 1.4rem 2rem;
    }
    .footer-inner { max-width: 1140px; margin: 0 auto; }
    .footer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,.1);
